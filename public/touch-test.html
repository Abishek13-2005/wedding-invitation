<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Touch Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f5efe4;

      font-family: Arial, sans-serif;
    }

    button {
      padding: 20px 35px;

      border: none;
      border-radius: 10px;

      background: #b99652;
      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

  <button
    onclick="this.textContent='TOUCH WORKS ✅'; this.style.background='#228B22';"
  >
    TAP ME
  </button>

</body>
</html>
